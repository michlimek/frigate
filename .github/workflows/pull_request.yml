name: On pull request

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".github/*.yml"
      - ".github/DISCUSSION_TEMPLATE/**"
      - ".github/ISSUE_TEMPLATE/**"

env:
  DEFAULT_PYTHON: 3.11
  # Match the proven external release build; Vite may exceed Node's default heap.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  web_lint:
    name: Web - Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20.x
      - run: npm install
        working-directory: ./web
      - name: Lint
        run: npm run lint
        working-directory: ./web
      - name: Check i18n keys
        run: |
          if ! npm run i18n:extract:ci; then
            git diff -- public/locales/en/common.json
            exit 1
          fi
        working-directory: ./web

  web_test:
    name: Web - Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20.x
      - run: npm install
        working-directory: ./web
      - name: Build web
        run: npm run build
        working-directory: ./web
      - name: Test grouped vehicle review cards
        run: npx vitest run --config vitest.vehicle-review.config.ts
        working-directory: ./web

  web_e2e:
    name: Web - E2E Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20.x
      - run: npm install
        working-directory: ./web
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: ./web
      - name: Build web for E2E
        run: npm run e2e:build
        working-directory: ./web
      - name: Run E2E tests
        run: npm run e2e
        working-directory: ./web
      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7

  python_checks:
    runs-on: ubuntu-latest
    name: Python Checks
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v5.4.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: Install requirements
        run: |
          python3 -m pip install -U pip
          python3 -m pip install -r docker/main/requirements-dev.txt
      - name: Check formatting
        run: |
          ruff format --check --diff frigate migrations docker *.py
      - name: Check lint
        run: |
          if ! ruff check frigate migrations docker *.py; then
            ruff check --diff frigate migrations docker *.py
            exit 1
          fi

  python_tests:
    runs-on: ubuntu-latest
    name: Python Tests
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Our HA fork ships a complete prebuilt 0.18.2 runtime overlay.
      # Test against that runtime rather than rebuilding upstream Nginx,
      # whose historical nginx-vod-module 1.31 tarball no longer exists.
      - name: Generate Frigate release version metadata
        if: github.base_ref == 'release/0.18.2'
        run: make version
      - name: Run release regression tests in Frigate runtime
        if: github.base_ref == 'release/0.18.2'
        run: |
          docker run --rm --workdir /opt/frigate --entrypoint python3 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,src=${{ github.workspace }}/frigate,dst=/opt/frigate/frigate,readonly" \
            ghcr.io/blakeblackshear/frigate:0.18.2 \
            -m unittest -v \
            frigate.test.test_vehicle_visit_matching \
            frigate.test.test_vehicle_visit_store \
            frigate.test.test_ptz_movement_prediction
      - uses: actions/setup-node@v6
        if: github.base_ref != 'release/0.18.2'
        with:
          node-version: 20.x
      - name: Install devcontainer cli
        if: github.base_ref != 'release/0.18.2'
        run: npm install --global @devcontainers/cli
      - name: Build devcontainer
        if: github.base_ref != 'release/0.18.2'
        env:
          DOCKER_BUILDKIT: "1"
        run: devcontainer build --workspace-folder .
      - name: Start devcontainer
        if: github.base_ref != 'release/0.18.2'
        run: devcontainer up --workspace-folder .
      - name: Run mypy in devcontainer
        if: github.base_ref != 'release/0.18.2'
        run: devcontainer exec --workspace-folder . bash -lc "python3 -u -m mypy --config-file frigate/mypy.ini frigate"
      - name: Check API spec is up to date
        if: github.base_ref != 'release/0.18.2'
        run: devcontainer exec --workspace-folder . bash -lc "python3 generate_api_auth_spec.py --check"
      - name: Run unit tests in devcontainer
        if: github.base_ref != 'release/0.18.2'
        run: devcontainer exec --workspace-folder . bash -lc "python3 -u -m unittest"
