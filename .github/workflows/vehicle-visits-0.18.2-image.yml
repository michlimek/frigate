name: SimplyQ Frigate AMD64 release image

on:
  workflow_dispatch:
  pull_request:
    branches:
      - release/0.18.2
    paths:
      - "Makefile"
      - ".dockerignore"
      - ".github/workflows/vehicle-visits-0.18.2-image.yml"
      - "docker/main/**"
      - "docker/ptz-vehicle-visits-release.Dockerfile"
      - "frigate_ptz/**"
      - "frigate/**"
      - "migrations/**"
      - "web/**"
  push:
    branches:
      - release/0.18.2
    paths:
      - "Makefile"
      - ".dockerignore"
      - ".github/workflows/vehicle-visits-0.18.2-image.yml"
      - "docker/main/**"
      - "docker/ptz-vehicle-visits-release.Dockerfile"
      - "frigate_ptz/**"
      - "frigate/**"
      - "migrations/**"
      - "web/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: vehicle-visits-amd64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-publish:
    name: Build, test and publish SimplyQ Frigate AMD64
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    outputs:
      version: ${{ steps.tags.outputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read version and establish image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk '$1 == "VERSION" && $2 == "=" {print $3}' Makefile)"
          if [[ ! "$VERSION" =~ ^0\.18\.2\.post[0-9]+$ ]]; then
            echo "Expected a SimplyQ post-release version in Makefile, got: $VERSION" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TEST_IMAGE=ghcr.io/michlimek/frigate:${VERSION}-${GITHUB_SHA:0:7}-amd64" >> "$GITHUB_ENV"
          echo "RELEASE_IMAGE=ghcr.io/michlimek/frigate:${VERSION}-amd64" >> "$GITHUB_ENV"
          echo "ADDON_IMAGE=ghcr.io/michlimek/frigate:${VERSION}" >> "$GITHUB_ENV"

      - name: Confirm HA add-on only pulls a prebuilt image
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^image: ghcr.io/michlimek/frigate$' frigate_ptz/config.yaml
          grep -Fxq "version: \"$RELEASE_VERSION\"" frigate_ptz/config.yaml
          test ! -e frigate_ptz/Dockerfile

      - name: Generate version and frontend build metadata
        run: |
          make version
          test -f frigate/version.py
          grep -q "$RELEASE_VERSION" frigate/version.py
          test -f web/.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build complete Frigate from source
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/ptz-vehicle-visits-release.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ env.TEST_IMAGE }}
            ${{ env.RELEASE_IMAGE }}
            ${{ env.ADDON_IMAGE }}
          cache-from: type=gha,scope=vehicle-visits-amd64
          cache-to: type=gha,scope=vehicle-visits-amd64,mode=max

      - name: Run vehicle-visit and PTZ regression tests inside image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --workdir /opt/frigate --entrypoint python3 "$TEST_IMAGE" \
            -m unittest -v \
            frigate.test.test_vehicle_visit_matching \
            frigate.test.test_vehicle_visit_store \
            frigate.test.test_ptz_movement_prediction

      - name: Generate API documentation from the built runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --workdir /opt/frigate --entrypoint python3 \
            -v "$GITHUB_WORKSPACE/generate_api_auth_spec.py:/opt/frigate/generate_api_auth_spec.py:ro" \
            -v "$GITHUB_WORKSPACE/docs:/opt/frigate/docs" \
            "$TEST_IMAGE" generate_api_auth_spec.py
      - name: Upload generated API documentation
        uses: actions/upload-artifact@v7
        with:
          name: frigate-api-spec
          path: docs/static/frigate-api.yaml

      - name: Verify migration and API modules in built image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --workdir /opt/frigate --entrypoint python3 "$TEST_IMAGE" \
            -c "from frigate.version import VERSION; from frigate.models import VehicleVisit, VehicleVisitEvent; from frigate.api.vehicle_visits import router; assert '0.18.2.post' in VERSION; assert len(router.routes) >= 5; print(VERSION)"

      - name: Check compiled frontend and backend in image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh "$TEST_IMAGE" -ec \
            'test -f /opt/frigate/web/index.html && test -f /opt/frigate/frigate/vehicle_visits/store.py && test -f /opt/frigate/migrations/036_create_vehicle_visit_tables.py && test -f /opt/frigate/migrations/037_add_vehicle_visit_closed_at.py'

      - name: Smoke test Frigate API and database startup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/visits-config" "$RUNNER_TEMP/visits-media"
          printf 'mqtt:\n  enabled: false\ncameras: {}\n' > "$RUNNER_TEMP/visits-config/config.yml"
          docker run -d --name frigate-vehicle-visits-smoke --shm-size 256m \
            -v "$RUNNER_TEMP/visits-config:/config" \
            -v "$RUNNER_TEMP/visits-media:/media/frigate" \
            --mount type=tmpfs,target=/tmp/cache,tmpfs-size=100000000 \
            -p 127.0.0.1:5000:5000 \
            "$TEST_IMAGE"
          trap 'docker rm -f frigate-vehicle-visits-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if payload="$(curl -fsS http://127.0.0.1:5000/api/version 2>/dev/null)"; then
              echo "$payload"
              if [[ "$payload" != *"$RELEASE_VERSION"* ]]; then
                echo "API started with a different Frigate version" >&2
                exit 1
              fi
              curl --fail --silent --show-error \
                "http://127.0.0.1:5000/api/vehicle_visits?camera=all" \
                >/dev/null
              curl --fail --silent --show-error -X POST \
                -H 'Content-Type: application/json' -d '{"event_ids":["missing"]}' \
                "http://127.0.0.1:5000/api/vehicle_visits/groups" >/dev/null
              docker exec frigate-vehicle-visits-smoke python3 -c \
                "import sqlite3; d=sqlite3.connect('/config/frigate.db'); names={r[0] for r in d.execute('select name from sqlite_master where type = ?', ('table',))}; assert {'vehiclevisit', 'vehiclevisitevent'} <= names, names; assert 'closed_at' in {r[1] for r in d.execute('pragma table_info(vehiclevisit)')}"
              exit 0
            fi
            sleep 5
          done
          docker logs frigate-vehicle-visits-smoke
          exit 1

      - name: Sign in to GitHub Container Registry
        if: github.ref == 'refs/heads/release/0.18.2' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish only successfully tested images
        if: github.ref == 'refs/heads/release/0.18.2' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          docker push "$TEST_IMAGE"
          docker push "$RELEASE_IMAGE"
          docker push "$ADDON_IMAGE"
          {
            echo "### Verified SimplyQ Frigate image"
            echo "Version: $RELEASE_VERSION"
            echo "Immutable: $TEST_IMAGE"
            echo "Docker tag: $RELEASE_IMAGE"
            echo "Home Assistant add-on image: $ADDON_IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"


  promote-ha-channel:
    name: Promote verified image to existing HA channel
    needs: build-test-publish
    if: github.ref == 'refs/heads/release/0.18.2' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: read
    env:
      RELEASE_VERSION: ${{ needs.build-test-publish.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify public manifest and advance HA metadata
        shell: bash
        run: |
          set -euo pipefail
          path=frigate_ptz/config.yaml
          grep -Fxq "version: \"$RELEASE_VERSION\"" "$path"
          grep -Fxq 'slug: frigate-ptz' "$path"
          grep -Fxq 'image: ghcr.io/michlimek/frigate' "$path"
          token="$(curl -fsSL --retry 3 'https://ghcr.io/token?scope=repository:michlimek/frigate:pull&service=ghcr.io' | jq -er '.token')"
          curl -fsSL --retry 5 -o /dev/null \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/michlimek/frigate/manifests/$RELEASE_VERSION"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=ha-addon")"
          sha="$(jq -er '.sha' <<< "$existing")"
          current="$(jq -er '.content' <<< "$existing" | base64 -d | awk '/^version:/{gsub(/"/, "", $2);print $2}')"
          [[ "$current" =~ ^0\.18\.2\.post[0-9]+$ ]]
          [[ "$RELEASE_VERSION" =~ ^0\.18\.2\.post[0-9]+$ ]]
          if (( ${current##*post} > ${RELEASE_VERSION##*post} )); then
            echo "Refusing to downgrade the HA channel" >&2
            exit 1
          fi
          if [[ "$current" == "$RELEASE_VERSION" ]]; then
            echo "HA channel already at $current"
            exit 0
          fi
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="Publish verified Frigate $RELEASE_VERSION to HA channel" \
            -f branch=ha-addon -f sha="$sha" -f content="$(base64 -w0 "$path")" >/dev/null
          echo "Promoted $RELEASE_VERSION to the existing #ha-addon repository" >> "$GITHUB_STEP_SUMMARY"
