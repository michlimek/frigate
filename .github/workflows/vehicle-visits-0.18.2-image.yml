name: SimplyQ Frigate 0.18.2.post1 AMD64 image

on:
  workflow_dispatch:
  pull_request:
    branches:
      - release/0.18.2
    paths:
      - "Makefile"
      - ".dockerignore"
      - ".github/workflows/vehicle-visits-0.18.2-image.yml"
      - "docker/main/**"
      - "frigate/**"
      - "migrations/**"
      - "web/**"
  push:
    branches:
      - release/0.18.2
    paths:
      - "Makefile"
      - ".dockerignore"
      - ".github/workflows/vehicle-visits-0.18.2-image.yml"
      - "docker/main/**"
      - "frigate/**"
      - "migrations/**"
      - "web/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: vehicle-visits-amd64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-publish:
    name: Build, test and publish SimplyQ Frigate AMD64
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read version and establish image tags
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk '$1 == "VERSION" && $2 == "=" {print $3}' Makefile)"
          if [[ ! "$VERSION" =~ ^0\.18\.2\.post[0-9]+$ ]]; then
            echo "Expected a SimplyQ post-release version in Makefile, got: $VERSION" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TEST_IMAGE=ghcr.io/michlimek/frigate:${VERSION}-${GITHUB_SHA:0:7}-amd64" >> "$GITHUB_ENV"
          echo "RELEASE_IMAGE=ghcr.io/michlimek/frigate:${VERSION}-amd64" >> "$GITHUB_ENV"
          echo "ADDON_IMAGE=ghcr.io/michlimek/frigate:${VERSION}" >> "$GITHUB_ENV"

      - name: Generate version and frontend build metadata
        run: |
          make version
          test -f frigate/version.py
          grep -q "$RELEASE_VERSION" frigate/version.py
          test -f web/.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build complete Frigate from source
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/main/Dockerfile
          platforms: linux/amd64
          target: frigate
          load: true
          push: false
          tags: |
            ${{ env.TEST_IMAGE }}
            ${{ env.RELEASE_IMAGE }}
            ${{ env.ADDON_IMAGE }}
          cache-from: type=gha,scope=vehicle-visits-amd64
          cache-to: type=gha,scope=vehicle-visits-amd64,mode=max

      - name: Run vehicle-visit and PTZ regression tests inside image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --workdir /opt/frigate --entrypoint python3 "$TEST_IMAGE" \
            -m unittest -v \
            frigate.test.test_vehicle_visit_matching \
            frigate.test.test_vehicle_visit_store \
            frigate.test.test_ptz_movement_prediction

      - name: Verify migration and API modules in built image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --workdir /opt/frigate --entrypoint python3 "$TEST_IMAGE" \
            -c "from frigate.version import VERSION; from frigate.models import VehicleVisit, VehicleVisitEvent; from frigate.api.vehicle_visits import router; assert '0.18.2.post' in VERSION; assert len(router.routes) >= 3; print(VERSION)"

      - name: Smoke test Frigate API and database startup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/visits-config" "$RUNNER_TEMP/visits-media"
          printf 'mqtt:\n  enabled: false\ncameras: {}\n' > "$RUNNER_TEMP/visits-config/config.yml"
          docker run -d --name frigate-vehicle-visits-smoke --shm-size 256m \
            -v "$RUNNER_TEMP/visits-config:/config" \
            -v "$RUNNER_TEMP/visits-media:/media/frigate" \
            --mount type=tmpfs,target=/tmp/cache,tmpfs-size=100000000 \
            -p 127.0.0.1:5000:5000 \
            "$TEST_IMAGE"
          trap 'docker rm -f frigate-vehicle-visits-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if payload="$(curl -fsS http://127.0.0.1:5000/api/version 2>/dev/null)"; then
              echo "$payload"
              if [[ "$payload" != *"$RELEASE_VERSION"* ]]; then
                echo "API started with a different Frigate version" >&2
                exit 1
              fi
              exit 0
            fi
            sleep 5
          done
          docker logs frigate-vehicle-visits-smoke
          exit 1

      - name: Sign in to GitHub Container Registry
        if: github.ref == 'refs/heads/release/0.18.2' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish only successfully tested images
        if: github.ref == 'refs/heads/release/0.18.2' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          docker push "$TEST_IMAGE"
          docker push "$RELEASE_IMAGE"
          docker push "$ADDON_IMAGE"
          {
            echo "### Verified SimplyQ Frigate image"
            echo "Version: $RELEASE_VERSION"
            echo "Immutable: $TEST_IMAGE"
            echo "Docker tag: $RELEASE_IMAGE"
            echo "Home Assistant add-on image: $ADDON_IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"
